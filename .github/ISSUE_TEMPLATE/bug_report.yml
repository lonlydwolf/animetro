name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Mac app, Browser]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or browser
      placeholder: e.g. Animetro 1.0.0 on macOS 15, or Safari 19
  - type: input
    id: page
    attributes:
      label: Page or anime
      placeholder: e.g. the line map for Naruto
