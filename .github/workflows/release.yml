name: Release

# Push a tag like v1.2.0 to build the Mac app and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Logic checks
        run: node test/check.mjs
      - name: Build the app (Apple Silicon + Intel)
        run: VERSION="${GITHUB_REF_NAME#v}" ./mac/build.sh
      - name: Zip it
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent build/Animetro.app "Animetro-$VERSION-macOS.zip"
          shasum -a 256 "Animetro-$VERSION-macOS.zip" > "Animetro-$VERSION-macOS.zip.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          ## Install
          Unzip, drag **Animetro** to Applications. Runs on Apple Silicon and Intel, macOS 13 or later.

          The app isn't notarized, so the first time macOS says it can't check it: **right-click › Open › Open**,
          or System Settings › Privacy & Security › **Open Anyway**.

          This project was created entirely by AI (Claude Opus 5.5). See the README.
          NOTES
          gh release create "$GITHUB_REF_NAME" "Animetro-$VERSION-macOS.zip" "Animetro-$VERSION-macOS.zip.sha256" \
            --title "Animetro $VERSION" --notes-file notes.md --generate-notes
