name: Release

# Push a tag like v1.2.0: the full CI runs first, then the Mac app is built and published as a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app (Apple Silicon + Intel)
        run: VERSION="${GITHUB_REF_NAME#v}" ./macos/build.sh
      - name: Check the built app starts
        run: ./macos/selftest.sh
      - name: Zip it
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent build/Animetro.app "Animetro-$VERSION-macOS.zip"
          shasum -a 256 "Animetro-$VERSION-macOS.zip" > "Animetro-$VERSION-macOS.zip.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # this version's section of CHANGELOG.md becomes the release notes
          NOTES=$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md 2>/dev/null || true)
          {
            echo "$NOTES"
            echo
            echo "## Install"
            echo "Unzip, drag **Animetro** to Applications. Runs on Apple Silicon and Intel, macOS 13 or later."
            echo "The app isn't notarized, so the first time macOS says it can't check it: **right-click › Open › Open**,"
            echo "or System Settings › Privacy & Security › **Open Anyway**."
            echo
            echo "This project was created entirely by AI (Claude Opus 5.5). See the README."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "Animetro-$VERSION-macOS.zip" "Animetro-$VERSION-macOS.zip.sha256" \
            --title "Animetro $VERSION" --notes-file notes.md
